{{- if .Values.frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "code-executor.fullname" . }}-frontend
  labels:
    {{- include "code-executor.labels" . | nindent 4 }}
    component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: code-executor
      component: frontend
  template:
    metadata:
      labels:
        app: code-executor
        component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: VITE_API_URL
              value: {{ .Values.frontend.apiUrl | quote }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
